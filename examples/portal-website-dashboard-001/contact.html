<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{BRAND_NAME}} — {{CONTACT_HEADLINE}}</title>
  <meta name="description" content="{{CONTACT_LEDE}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section data-vincia-section-type="nav-primary" class="site-header">
    <div class="inner">
      <a class="brand-mark" href="/" data-slot-role="nav-label">{{BRAND_NAME}}</a>
      <nav data-vincia-nav="primary" class="nav-anchors">
        <a data-vincia-nav-item="product" href="index.html#features" data-slot-role="nav-label">{{NAV_PRODUCT}}</a>
        <a data-vincia-nav-item="pricing" href="index.html#pricing" data-slot-role="nav-label">{{NAV_PRICING}}</a>
        <a data-vincia-nav-item="about" href="about.html">About</a>
      </nav>
      <div class="nav-actions">
        <a class="btn ghost sm" href="login.html" data-slot-role="cta-ghost">{{NAV_SIGN_IN}}</a>
        <a class="btn primary sm" href="signup.html" data-slot-role="cta-primary">{{NAV_GET_STARTED}}</a>
      </div>
    </div>
  </section>

  <section data-vincia-section-type="hero" class="hero">
    <div class="container-narrow">
      <h1 class="h1" data-slot-role="heading-display">{{CONTACT_HEADLINE}}</h1>
      <p class="lede" style="margin-top: var(--space-4)" data-slot-role="lede">{{CONTACT_LEDE}}</p>
    </div>
  </section>

  <section data-vincia-section-type="contact-form" class="features-band">
    <div class="container-narrow">
      <div class="card">
        <form data-vincia-form="contact" class="auth-form" method="post">
          <div class="field">
            <label for="cname" data-slot-role="field-label">{{CONTACT_FORM_NAME_LABEL}}</label>
            <input id="cname" type="text" name="name" data-vincia-field="name" autocomplete="name">
          </div>
          <div class="field">
            <label for="cemail" data-slot-role="field-label">{{CONTACT_FORM_EMAIL_LABEL}}</label>
            <input id="cemail" type="email" name="email" data-vincia-field="email" autocomplete="email">
          </div>
          <div class="field">
            <label for="cmsg" data-slot-role="field-label">{{CONTACT_FORM_MESSAGE_LABEL}}</label>
            <textarea id="cmsg" name="message" data-vincia-field="message" rows="5"></textarea>
          </div>
          <div>
            <button type="submit" class="btn primary" data-slot-role="cta-primary">{{CONTACT_FORM_SUBMIT}}</button>
          </div>
          <p class="muted" style="font-size: var(--type-small)" data-slot-role="meta">{{CONTACT_EMAIL}}</p>
        </form>
      </div>
    </div>
  </section>

  <section data-vincia-section-type="site-footer" class="site-footer">
    <div class="container">
      <div class="footer-bottom" data-slot-role="footer-copyright">{{FOOTER_COPYRIGHT}}</div>
    </div>
  </section>
  <script src="preview-inline.js" defer></script>
</body>
</html>
