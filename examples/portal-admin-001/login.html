<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{BRAND_NAME}} — {{AUTH_LOGIN_HEADLINE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="auth-shell">
    <section data-vincia-section-type="auth-login-form" class="auth-card">
      <span class="brand-mark" data-slot-role="nav-label">{{BRAND_NAME}}</span>
      <h1 data-slot-role="heading-display">{{AUTH_LOGIN_HEADLINE}}</h1>
      <p class="lede" data-slot-role="lede">{{AUTH_LOGIN_LEDE}}</p>
      <form data-vincia-form="login" method="post" action="/api/auth/login">
        <div class="field">
          <label for="email" data-slot-role="field-label">{{AUTH_LOGIN_EMAIL_LABEL}}</label>
          <input id="email" type="email" name="email" data-vincia-field="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password" data-slot-role="field-label">{{AUTH_LOGIN_PASSWORD_LABEL}}</label>
          <input id="password" type="password" name="password" data-vincia-field="password" autocomplete="current-password" required>
        </div>
        <div class="field-row">
          <span></span>
          <a href="#reset" data-slot-role="link-label">{{AUTH_LOGIN_FORGOT}}</a>
        </div>
        <button type="submit" class="btn primary" data-slot-role="cta-primary">{{AUTH_LOGIN_SUBMIT}}</button>
      </form>
      <div class="auth-divider">or</div>
      <button type="button" class="sso-button" data-slot-role="cta-secondary">{{AUTH_LOGIN_SSO_LABEL}}</button>
    </section>
  </main>
</body>
</html>
